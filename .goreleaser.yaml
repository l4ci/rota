# Release build for the rota CLI. Asset names are a contract with install.sh: it
# downloads rota_<os>_<arch>, verifies its .minisig and checks it against
# checksums.txt. Run `HOMEBREW_TAP_DEPLOY_KEY=x goreleaser release --snapshot --clean --skip=sign`
# to build locally.
version: 2
project_name: rota

builds:
  - id: rota
    main: ./cmd/rota
    binary: rota
    env:
      - CGO_ENABLED=0
    # No windows: the sidecar lock uses flock (as the Go lock code does).
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/l4ci/rota/internal/version.Version={{ .Version }}
      - -X github.com/l4ci/rota/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/l4ci/rota/internal/version.Date={{ .Date }}

archives:
  # Bare binaries for install.sh.
  - id: installer
    formats: [binary]
    name_template: "rota_{{ .Os }}_{{ .Arch }}"
  # Tarballs for people and package managers.
  - id: tarball
    formats: [tar.gz]
    name_template: "rota_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Every uploaded file (binaries, tarballs, checksums.txt) gets a detached
# minisign signature, <file>.minisig. install.sh verifies rota_<os>_<arch> against
# the public key embedded in it. The workflow writes the secret key to the file
# MINISIGN_KEY_FILE names; the key is unencrypted, so there is no password prompt.
# A local snapshot run has no key: pass --skip=sign.
signs:
  - id: minisign
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
    signature: "${artifact}.minisig"
    artifacts: all

# One GitHub release per version. The release workflow (on a v* tag) makes it
# as a draft carrying the binaries; `rota release publish` then fills in the
# approved notes and publishes it. A draft's assets do not resolve at
# /releases/download/, so install.sh sees nothing until that gated step. Notes come
# from /rota-release, not from commit messages.
release:
  draft: true
  replace_existing_draft: true
changelog:
  disable: true

# brews is deprecated in favour of homebrew_casks, but casks are macOS-only and
# live in Casks/; a formula is the only way to serve Linux, so brews stays until
# goreleaser offers a replacement that does (#8).
# Homebrew formula, pushed to the tap on release over git with a deploy key. The
# tap repo and the key are the maintainer's one-time setup (HOMEBREW_TAP_DEPLOY_KEY,
# see .rota/RELEASE.md). private_key takes the key contents or a path; the key
# must not be password-protected. A snapshot run never pushes but still renders the template, so set the
# variable to any value for it: HOMEBREW_TAP_DEPLOY_KEY=x goreleaser release --snapshot --clean.
# skip_upload: auto keeps a prerelease tag out of the tap. The formula installs
# from the tarballs above; goreleaser fills in their URLs and sha256 sums.
# Note: the formula is built when the draft is made, so it points at assets
# that only resolve once `rota release publish` publishes the draft; run that
# promptly after the workflow finishes.
brews:
  - name: rota
    ids: [tarball]
    repository:
      owner: l4ci
      name: homebrew-tap
      git:
        url: git@github.com:l4ci/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # Without this the formula lands in the tap root (0.9.0 did, #8); brew
    # reads formulas from Formula/.
    directory: Formula
    homepage: https://github.com/l4ci/rota
    description: Plan, ship and run parallel rounds with AI coding agents
    license: MIT
    skip_upload: auto
    test: |
      assert_match version.to_s, shell_output("#{bin}/rota version")
    caveats: |
      Next: rota skills install
