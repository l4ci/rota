# Shard-safety guard (#82): test/gate.sh runs smoke in concurrent shards, which is
# only sound while no section needs state from another. This deals the sections
# out at random on main; a section with a hidden dependency fails here.
name: Smoke shards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  random-partition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Section 97 signs fake releases; release.yml pins the same version.
      - run: go install aead.dev/minisign/cmd/minisign@v0.3.0
      - run: bash test/gate.sh --smoke-only --random
        env:
          ROTA_GATE_LOGS: ${{ runner.temp }}/gate-logs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: gate-logs
          path: ${{ runner.temp }}/gate-logs
