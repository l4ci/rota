# Builds the rota binaries for a version tag, signs them with minisign and attaches
# them to a DRAFT GitHub release (see .goreleaser.yaml). Publishing is the gated `rota release publish`
# step in /rota-release, which finishes this draft instead of creating a second
# release. Push the tag first (`rota release push --tag-only`), wait for this
# job, then publish, then push the branch.
#
# The tag builds the binary (its version comes from the tag through ldflags);
# VERSION is what `rota release bump` edits. The first step refuses a tag that
# does not match VERSION, so the two cannot drift.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($want)" >&2
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Signs the release assets (signs: in .goreleaser.yaml). Same implementation
      # that generated the key; the version is pinned. The unencrypted secret key
      # goes to a file only this job can read and is removed at the end.
      - name: Set up minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "secret MINISIGN_SECRET_KEY is not set; see .rota/RELEASE.md" >&2
            exit 1
          fi
          go install aead.dev/minisign/cmd/minisign@v0.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SSH deploy key with write access to l4ci/homebrew-tap (key contents,
          # not a path); see .rota/RELEASE.md.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"
  # Codex drops symlinks when it caches a plugin, so the Codex tree is built
  # here, not committed: scripts/codex-plugin.sh copies each skill's
  # references in for real, and the result replaces the `codex` branch that
  # .agents/plugins/marketplace.json installs from.
  codex-plugin:
    needs: goreleaser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Publish the codex branch
        run: |
          bash scripts/codex-plugin.sh "$RUNNER_TEMP/codex"
          cd "$RUNNER_TEMP/codex"
          git init -q -b codex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins
          git commit -qm "Codex plugin for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" codex
